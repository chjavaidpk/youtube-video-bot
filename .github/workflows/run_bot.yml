name: Run YouTube Watcher Bot

on:
  workflow_dispatch: # اس کا مطلب ہے کہ آپ موبائل سے بٹن دبا کر بوٹ چلا سکتے ہیں
  schedule:
    - cron: '0 */6 * * *' # یہ ہر 6 گھنٹے بعد خود بخود چلائے گا

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      run: python bot.py
      
